# cargo-deny: bekannte Sicherheitslücken, Lizenzen, Herkunft der Crates.
# Lokal: cargo deny check   ·   Doku: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
# RustSec-Datenbank; Funde und zurückgezogene Versionen sind Fehler.
yanked = "deny"
# „Nicht mehr gepflegt“ nur für direkte Abhängigkeiten melden – transitive
# (instant, derivative, proc-macro-error2 über serenity/songbird) lassen sich
# hier nicht austauschen.
unmaintained = "workspace"
#
# Ausnahmen – alle in transitiven Abhängigkeiten, für die es (Stand
# 2026-11-19) kein kompatibles Update gibt. Bei jedem Update von serenity bzw.
# songbird prüfen und wieder entfernen.
ignore = [
    # serenity 0.12.5 (neueste) → tokio-tungstenite 0.21 → rustls 0.22 /
    # rustls-webpki 0.102 (keine 0.102.x mit Fix). TLS nur als Client zu
    # Discord mit den webpki-Wurzelzertifikaten, ohne CRLs, ohne Debug-Ausgabe
    # von Sitzungen.
    { id = "RUSTSEC-2026-0049", reason = "serenity: rustls-webpki 0.102, CRLs werden nicht verwendet" },
    { id = "RUSTSEC-2026-0104", reason = "serenity: rustls-webpki 0.102, CRLs werden nicht verwendet" },
    { id = "RUSTSEC-2026-0098", reason = "serenity: rustls-webpki 0.102, setzt falsch ausstellende CA voraus" },
    { id = "RUSTSEC-2026-0099", reason = "serenity: rustls-webpki 0.102, setzt falsch ausstellende CA voraus" },
    { id = "RUSTSEC-2026-0382", reason = "serenity: rustls-webpki 0.102, kein Fix verfügbar" },
    { id = "RUSTSEC-2026-0346", reason = "serenity: rustls 0.22, TLS-Sitzungen werden nie per Debug ausgegeben" },
    { id = "RUSTSEC-2026-0349", reason = "serenity: rustls 0.22, betrifft nur den Post-Quantum-Schlüsselaustausch" },
    # songbird 0.6.1 (neueste) → ringbuf ^0.4: betrifft nur Elemente, deren
    # Drop panikt – songbird puffert Audio-Bytes, die nicht panikken können.
    { id = "RUSTSEC-2026-0293", reason = "songbird: ringbuf 0.4, nur bei panikendem Drop (Audio-Bytes)" },
    # songbird 0.6.1 → davey ^0.1 (DAVE-Verschlüsselung) → openmls/hpke-rs →
    # libcrux, crypto-bigint. Kein kompatibles Update; DAVE ist Pflicht für
    # Discord-Voice.
    { id = "RUSTSEC-2026-0207", reason = "songbird/DAVE: libcrux-sha3, kein kompatibles Update" },
    { id = "RUSTSEC-2026-0208", reason = "songbird/DAVE: libcrux-sha3, kein kompatibles Update" },
    { id = "RUSTSEC-2026-0212", reason = "songbird/DAVE: libcrux-secrets, kein kompatibles Update" },
    { id = "RUSTSEC-2026-0387", reason = "songbird/DAVE: crypto-bigint 0.5, kein kompatibles Update" },
]

[licenses]
# Nur freie Lizenzen, die mit MIT verträglich sind.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace-Crates (path-Abhängigkeiten) sind keine Wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
lemusic-core = { path = "crates/core" }
lemusic-player = { path = "crates/player" }
lemusic-bot = { path = "crates/bot" }
lemusic-web = { path = "crates/web" }

anyhow = "1.0.104"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
axum = "0.8"
fastrand = "2"
flume = { version = "0.11", default-features = false }
poise = "0.7"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "cache", "rustls_backend", "voice"] }
songbird = { version = "0.6", features = ["builtin-queue"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
symphonia = { version = "0.5", default-features = false, features = ["pcm"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "io-util", "time", "net", "sync"] }
tracing = "0.1.44"
uuid = "1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

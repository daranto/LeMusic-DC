# Automatische Update-PRs für Abhängigkeiten. Die CI (fmt, clippy, Tests,
# cargo-deny) prüft jeden PR, bevor er gemergt wird.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Kleine Updates gesammelt in einem PR statt Dutzender einzelner.
      cargo-minor:
        update-types: [minor, patch]
    ignore:
      # Muss zu songbird passen (siehe Cargo.toml) – ein eigenes Update würde
      # das PCM-Dekodieren abschalten und die Wiedergabe zur Laufzeit brechen.
      - dependency-name: symphonia

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Basis-Images im Dockerfile (rust, python, static-ffmpeg).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday

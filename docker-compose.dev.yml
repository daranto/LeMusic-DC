# Entwicklung: Image lokal aus dem Quellcode bauen statt von GHCR zu laden.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  lemusic:
    image: lemusic:dev
    build: .
    environment:
      # Zusätzlich die Audio-Takt-Messung im Log (jede Minute).
      RUST_LOG: info,serenity=warn,songbird=warn,lemusic_player::diagnostics=debug
